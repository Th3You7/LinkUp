services:
  server:
    build:
      context: server
      dockerfile: Dockerfile
    container_name: server
    restart: always
    ports:
      - 8080:8080
    depends_on:
      - mysql
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: th3you78
      MYSQL_DATABASE: linkup
      MYSQL_USER: root
      MYSQL_PASSWORD: th3you78

  front:
    build:
      context: front
      dockerfile: Dockerfile
    container_name: front
    restart: always
    ports:
      - 4200:80
    depends_on:
      - server
