<header
  class="fixed border-b border-gray-200 top-0 inset-x-0 flex flex-wrap md:justify-start md:flex-nowrap z-48 md:z-61 bg-white py-2.5"
>
  <nav
    class="px-4 sm:px-6 lg:px-8 flex flex-wrap basis-full justify-between items-center md:grid md:grid-cols-12 w-full mx-auto"
  >
    <div class="md:order-1 md:col-span-3 flex items-center sm:gap-x-1.5">
      <a
        class="shrink-0 text-xl inline-block font-semibold focus:outline-hidden focus:opacity-80"
        routerLink="/home"
        aria-label="LinkUp"
      >
        <svg
          class="shrink-0 size-7"
          width="36"
          height="36"
          viewBox="0 0 36 36"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            fillRule="evenodd"
            clip-rule="evenodd"
            d="M18.0835 3.23358C9.88316 3.23358 3.23548 9.8771 3.23548 18.0723V35.5832H0.583496V18.0723C0.583496 8.41337 8.41851 0.583252 18.0835 0.583252C27.7485 0.583252 35.5835 8.41337 35.5835 18.0723C35.5835 27.7312 27.7485 35.5614 18.0835 35.5614H16.7357V32.911H18.0835C26.2838 32.911 32.9315 26.2675 32.9315 18.0723C32.9315 9.8771 26.2838 3.23358 18.0835 3.23358Z"
            class="fill-blue-600"
            fill="currentColor"
          />
          <path
            fillRule="evenodd"
            clip-rule="evenodd"
            d="M18.0833 8.62162C12.8852 8.62162 8.62666 12.9245 8.62666 18.2879V35.5833H5.97468V18.2879C5.97468 11.5105 11.3713 5.97129 18.0833 5.97129C24.7954 5.97129 30.192 11.5105 30.192 18.2879C30.192 25.0653 24.7954 30.6045 18.0833 30.6045H16.7355V27.9542H18.0833C23.2815 27.9542 27.54 23.6513 27.54 18.2879C27.54 12.9245 23.2815 8.62162 18.0833 8.62162Z"
            class="fill-blue-600"
            fill="currentColor"
          />
          <path
            d="M24.8225 18.1012C24.8225 21.8208 21.8053 24.8361 18.0833 24.8361C14.3614 24.8361 11.3442 21.8208 11.3442 18.1012C11.3442 14.3815 14.3614 11.3662 18.0833 11.3662C21.8053 11.3662 24.8225 14.3815 24.8225 18.1012Z"
            class="fill-blue-600"
            fill="currentColor"
          />
        </svg>
      </a>

      <div class="hidden sm:block ms-1"></div>
    </div>

    <!-- Button Group -->
    <div
      class="md:order-3 md:col-span-3 flex md:justify-end items-center gap-x-2"
    >
      <!-- Notifications Button -->
      <button
        type="button"
        class="relative group flex flex-col justify-center items-center text-xs text-gray-600 disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden"
      >
        <span
          class="flex justify-center items-center gap-x-3 size-9 rounded-full group-hover:bg-gray-200 group-focus:bg-gray-200 transition"
        >
          <svg
            class="shrink-0 size-4"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <path d="M10.268 21a2 2 0 0 0 3.464 0" />
            <path
              d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"
            />
          </svg>
        </span>
        <span class="sr-only">Notifications</span>
      </button>

      <!-- Account Dropdown -->
      <div class="hs-tooltip [--placement:auto] inline-block">
        <div
          class="hs-dropdown inline-flex [--strategy:absolute] [--auto-close:inside] [--placement:bottom-right] relative text-start"
        >
          <button
            id="hs-dnad"
            type="button"
            class="hs-tooltip-toggle group flex flex-col justify-center items-center text-xs text-gray-600 disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-label="Dropdown"
          >
            <span
              class="hs-tooltip-content hs-tooltip-shown:opacity-100 hs-tooltip-shown:visible opacity-0 transition-opacity inline-block absolute invisible z-10 py-1 px-2 bg-gray-200 text-xs text-gray-800 rounded-md"
              role="tooltip"
            >
              Busy
            </span>
            <span
              class="relative flex justify-center items-center gap-x-3 size-9 rounded-full group-hover:bg-gray-200 group-focus:bg-gray-200 transition"
            >
              <img
                class="shrink-0 size-8 rounded-full"
                [src]="getUserAvatar()"
                [alt]="getUserName()"
              />
              <span
                class="absolute bottom-0.5 end-0.5 block size-2 rounded-full ring-2 ring-white bg-red-500 text-white"
              ></span>
            </span>
            <span class="sr-only">{{ getUserName() }}</span>
          </button>

          <!-- Account Dropdown Menu -->
          <div
            class="hs-dropdown-menu hs-dropdown-open:opacity-100 w-60 transition-[opacity,margin] duration opacity-0 hidden z-20 bg-white border border-gray-200 rounded-xl shadow-xl"
            role="menu"
            aria-orientation="vertical"
            aria-labelledby="hs-dnad"
          >
            <div class="p-1">
              <div
                class="hs-dropdown [--strategy:static] md:[--strategy:absolute] [--adaptive:none] md:[--trigger:hover] --exclude-from-auto-opening relative"
              >
                <button
                  id="hs-pro-vcnadpr"
                  type="button"
                  class="hs-dropdown-toggle w-full flex items-center gap-x-2 py-2 px-3 text-start rounded-lg text-sm text-gray-800 hover:bg-gray-100 focus:outline-hidden focus:bg-gray-100"
                  aria-haspopup="menu"
                  aria-expanded="false"
                  aria-label="Dropdown"
                >
                  <span class="shrink-0">
                    <img
                      class="shrink-0 size-9 rounded-full"
                      [src]="getUserAvatar()"
                      [alt]="getUserName()"
                    />
                  </span>
                  <span class="grow truncate">
                    <span class="truncate font-medium text-gray-800">
                      {{ getUserName() }}
                    </span>
                    <span class="block truncate text-sm text-gray-500">
                      {{ getUserEmail() }}
                    </span>
                  </span>
                  <svg
                    class="shrink-0 rotate-90 md:rotate-0 ms-auto size-3.5"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                  >
                    <path d="m9 18 6-6-6-6" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="p-1 border-t border-gray-200">
              <div class="pt-1 mt-1 border-t border-gray-200">
                <a
                  class="flex items-center gap-x-2 py-2 px-3 rounded-lg text-sm text-gray-800 hover:bg-gray-100 disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-gray-100 cursor-pointer"
                  (click)="logout()"
                >
                  Sign out
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="md:hidden">
        <!-- Collapse Button Trigger -->
        <button
          type="button"
          class="relative group flex flex-col justify-center items-center text-xs text-gray-600 disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden"
          id="hs-pro-dmh-collapse"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-controls="hs-pro-dmh"
          aria-label="Toggle navigation"
        >
          <span
            class="flex justify-center items-center gap-x-3 size-9 rounded-full group-hover:bg-gray-200 group-focus:bg-gray-200 transition"
          >
            <svg
              class="shrink-0 size-4"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
            >
              <circle cx="12" cy="12" r="1" />
              <circle cx="12" cy="5" r="1" />
              <circle cx="12" cy="19" r="1" />
            </svg>
          </span>
          <span class="sr-only">Menu</span>
        </button>
      </div>
    </div>

    <!-- Nav Links -->
    <div
      class="md:order-2 md:col-span-6 basis-full grow md:basis-auto md:grow-0"
    >
      <!-- Collapse -->
      <div
        id="hs-pro-dmh"
        class="hs-overlay [--auto-close:lg] [--overlay-backdrop:false] hs-overlay-open:translate-y-0 hs-overlay-open:translate-x-0 hs-overlay-open:scale-100 hs-overlay-open:opacity-100 -translate-y-1/2 translate-x-1/2 scale-25 opacity-0 transition-all duration-300 transform w-72 hidden fixed top-2 end-2 z-60 bg-white shadow-xl rounded-xl md:static md:block md:h-auto md:w-full md:translate-none md:transition-none md:transform-none md:scale-100 md:opacity-100 md:z-40 md:rounded-none md:shadow-none"
        role="dialog"
        tabindex="-1"
        aria-label="Sidebar"
      >
        <div
          class="overflow-hidden overflow-y-auto h-full [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-gray-100 [&::-webkit-scrollbar-thumb]:bg-gray-300"
        >
          <!-- Header -->
          <div
            class="py-2 px-4 md:hidden flex justify-between items-center border-b border-gray-200"
          >
            <h3 class="font-medium text-gray-800">Menu</h3>
            <button
              type="button"
              class="py-1.5 px-2 inline-flex justify-center items-center gap-x-1 rounded-full border border-gray-200 text-xs text-gray-800 hover:bg-gray-100 focus:outline-hidden focus:bg-gray-100 disabled:opacity-50 disabled:pointer-events-none"
              aria-label="Close"
            >
              <span class="hidden lg:block">Esc</span>
              <span class="block lg:hidden">Close</span>
              <svg
                class="shrink-0 size-4"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
              >
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </button>
          </div>

          <div
            class="py-4 px-1.5 md:p-0 flex flex-col md:flex-row md:justify-center md:items-center gap-1 md:gap-x-7 pt-2 md:pt-0"
          >
            <a
              class="relative group flex flex-row md:flex-col items-center gap-x-2 md:gap-x-0 text-sm md:text-xs text-gray-800 disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden"
              routerLink="/home"
            >
              <span
                class="flex justify-center items-center gap-x-3 size-9 rounded-full group-hover:bg-gray-200 group-focus:bg-gray-200 transition"
              >
                <svg
                  class="shrink-0 size-4"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="2"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                >
                  <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                  <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
              </span>
              Home
            </a>
            <a
              class="relative group flex flex-row md:flex-col items-center gap-x-2 md:gap-x-0 text-sm md:text-xs text-gray-800 disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden"
              routerLink="/chat"
            >
              <span
                class="flex justify-center items-center gap-x-3 size-9 rounded-full group-hover:bg-gray-200 group-focus:bg-gray-200 transition"
              >
                <svg
                  class="shrink-0 size-4"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="2"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                >
                  <path
                    d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"
                  />
                  <rect x="2" y="6" width="14" height="12" rx="2" />
                </svg>
              </span>
              Chat
            </a>
            <a
              class="relative group flex flex-row md:flex-col items-center gap-x-2 md:gap-x-0 text-sm md:text-xs text-gray-800 disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden"
              routerLink="/profile"
            >
              <span
                class="flex justify-center items-center gap-x-3 size-9 rounded-full group-hover:bg-gray-200 group-focus:bg-gray-200 transition"
              >
                <svg
                  class="shrink-0 size-4"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="2"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                >
                  <path
                    d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
                  />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </span>
              Profile
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>
