<div class="p-3 md:p-5 bg-white border border-gray-200 shadow-2xs rounded-xl">
  <!-- SVG Background Element -->
  <figure>
    <svg
      class="w-full"
      preserveAspectRatio="none"
      width="1113"
      height="161"
      viewBox="0 0 1113 161"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <g clip-path="url(#clip0_666_220723)">
        <rect x="0.5" width="1112" height="161" rx="12" fill="white"></rect>
        <rect x="1" width="1112" height="348" fill="#D9DEEA"></rect>
        <path
          d="M512.694 359.31C547.444 172.086 469.835 34.2204 426.688 -11.3096H1144.27V359.31H512.694Z"
          fill="#C0CBDD"
        ></path>
        <path
          d="M818.885 185.745C703.515 143.985 709.036 24.7949 726.218 -29.5801H1118.31V331.905C1024.49 260.565 963.098 237.945 818.885 185.745Z"
          fill="#8192B0"
        ></path>
      </g>
      <defs>
        <clipPath id="clip0_666_220723">
          <rect x="0.5" width="1112" height="161" rx="12" fill="white"></rect>
        </clipPath>
      </defs>
    </svg>
  </figure>
  <!-- End SVG Background Element -->

  <!-- Avatar -->
  <div class="-mt-24">
    <div
      class="relative flex size-30 mx-auto border-4 border-white rounded-full"
    >
      <img
        class="object-cover size-full rounded-full"
        [src]="
          currentUser?.avatar ||
          'https://images.unsplash.com/photo-1659482634023-2c4fda99ac0c?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=facearea&facepad=3&w=320&h=320&q=80'
        "
        [alt]="getFullName()"
      />

      <div class="absolute bottom-0 -end-2">
        <button
          type="button"
          class="group p-2 max-w-[125px] inline-flex justify-center items-center gap-x-1.5 text-start bg-white border border-gray-200 text-gray-800 text-xs font-medium rounded-full whitespace-nowrap shadow-2xs align-middle hover:bg-gray-50 focus:outline-hidden focus:bg-gray-100"
          data-hs-overlay="#hs-pro-dsm"
          (click)="currentTabChange.emit('my-profile')"
        >
          <svg
            class="shrink-0 size-4 text-gray-500"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <path d="M8 14s1.5 2 4 2 4-2 4-2" />
            <line x1="9" x2="9.01" y1="9" y2="9" />
            <line x1="15" x2="15.01" y1="9" y2="9" />
          </svg>
          <span class="group-hover:block hidden">Set status</span>
        </button>
      </div>
    </div>

    <div class="mt-3 text-center">
      <h1 class="text-xl font-semibold text-gray-800">{{ getFullName() }}</h1>
      <p class="text-gray-500">{{ getUsername() }}</p>
    </div>
  </div>
  <!-- End Avatar -->

  <!-- Header -->
  <div
    class="mt-4 md:mt-7 -mb-0.5 flex flex-col md:flex-row md:justify-between md:items-center gap-3"
  >
    <div class="md:order-2 flex justify-center md:justify-end gap-2">
      <!-- Edit button for own profile -->
      <a
        *ngIf="isOwnProfile()"
        class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-2xs hover:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-gray-50"
        href="../../pro/dashboard/account-profile.html"
      >
        Edit
      </a>

      <!-- Friendship buttons for other profiles -->
      <div *ngIf="!isOwnProfile()" class="flex items-center gap-2">
        <!-- Add Friend / Unfriend Button -->
        <button
          *ngIf="!isBlocked() && !isPending()"
          (click)="isFriend() ? removeFriend() : addFriend()"
          [class]="
            isFriend()
              ? 'py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-red-200 bg-red-50 text-red-700 shadow-2xs hover:bg-red-100 focus:outline-hidden focus:bg-red-100 cursor-pointer'
              : 'py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-2xs hover:bg-gray-50 focus:outline-hidden focus:bg-gray-50 cursor-pointer'
          "
        >
          <svg
            *ngIf="!isFriend()"
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 6v6m0 0v6m0-6h6m-6 0H6"
            ></path>
          </svg>
          <svg
            *ngIf="isFriend()"
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
          {{ isFriend() ? "Unfriend" : "Add Friend" }}
        </button>

        <!-- Pending Sender Button (Cancel) -->
        <div *ngIf="!isBlocked() && isPendingSender()" class="relative group">
          <button
            (click)="cancelFriendRequest()"
            class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-gray-50 text-gray-600 shadow-2xs hover:bg-gray-100 focus:outline-hidden focus:bg-gray-100 cursor-pointer"
          >
            Pending
          </button>
          <!-- Hover Tooltip -->
          <div
            class="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 px-2 py-1 text-xs text-white bg-gray-800 rounded opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none whitespace-nowrap z-10"
          >
            Cancel
          </div>
        </div>

        <!-- Pending Receiver Buttons (Accept/Reject) -->
        <div
          *ngIf="!isBlocked() && isPendingReceiver()"
          class="flex items-center gap-2"
        >
          <button
            (click)="acceptFriendRequest()"
            class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-emerald-200 bg-emerald-500 text-white shadow-2xs hover:bg-emerald-600 focus:outline-hidden focus:bg-emerald-600 cursor-pointer"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7"
              ></path>
            </svg>
            Accept
          </button>
          <button
            (click)="rejectFriendRequest()"
            class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-700 shadow-2xs hover:bg-gray-50 focus:outline-hidden focus:bg-gray-50 cursor-pointer"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
            Reject
          </button>
        </div>

        <!-- Message Button -->
        <button
          *ngIf="!isBlocked()"
          (click)="startChat()"
          class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-green-200 bg-green-500 text-white shadow-2xs hover:bg-green-600 focus:outline-hidden focus:bg-green-600 cursor-pointer"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
            ></path>
          </svg>
          Message
        </button>

        <!-- Block Dropdown -->
        <div *ngIf="!isBlocked()" class="relative">
          <button
            (click)="toggleBlockDropdown()"
            class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-2xs hover:bg-gray-50 focus:outline-hidden focus:bg-gray-50 cursor-pointer"
          >
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
              <path
                d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"
              ></path>
            </svg>
          </button>
          <div
            *ngIf="isBlockDropdownOpen"
            class="absolute right-0 mt-1 w-32 bg-white border border-gray-200 rounded-md shadow-lg z-10"
          >
            <button
              (click)="onBlockUser()"
              class="block w-full text-left px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded-md cursor-pointer"
            >
              Block
            </button>
          </div>
        </div>

        <!-- Unblock Button (when user is blocked) -->
        <button
          *ngIf="isBlocked()"
          (click)="unblockUser()"
          class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-orange-200 bg-orange-50 text-orange-700 shadow-2xs hover:bg-orange-100 focus:outline-hidden focus:bg-orange-100 cursor-pointer"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"
            ></path>
          </svg>
          Unblock
        </button>
      </div>
    </div>

    <!-- Nav -->
    <div
      class="relative flex justify-center md:justify-start"
      data-hs-scroll-nav='{
          "autoCentering": true
        }'
    >
      <nav
        class="hs-scroll-nav-body flex flex-nowrap gap-x-1 overflow-x-auto [&::-webkit-scrollbar]:h-0 snap-x snap-mandatory pb-1.5"
      >
        <a
          [class]="
            currentTab === 'my-profile'
              ? 'snap-start relative inline-flex flex-nowrap items-center gap-x-2 px-2.5 py-1.5 bg-emerald-100 text-emerald-700 text-sm whitespace-nowrap rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden after:absolute after:-bottom-0.5 after:inset-x-0 after:z-10 after:w-1/4 after:h-0.5 after:bg-emerald-600 after:rounded-full after:mx-auto after:pointer-events-none cursor-pointer'
              : 'snap-start relative inline-flex flex-nowrap items-center gap-x-2 px-2.5 py-1.5 hover:bg-gray-100 text-gray-500 hover:text-gray-800 text-sm whitespace-nowrap rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-gray-100 after:absolute after:-bottom-0.5 after:inset-x-0 after:z-10 after:w-1/4 after:h-0.5 after:rounded-full after:mx-auto after:pointer-events-none cursor-pointer'
          "
          (click)="currentTabChange.emit('my-profile')"
        >
          <svg
            class="shrink-0 size-4"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="18" cy="15" r="3" />
            <circle cx="9" cy="7" r="4" />
            <path d="M10 15H6a4 4 0 0 0-4 4v2" />
            <path d="m21.7 16.4-.9-.3" />
            <path d="m15.2 13.9-.9-.3" />
            <path d="m16.6 18.7.3-.9" />
            <path d="m19.1 12.2.3-.9" />
            <path d="m19.6 18.7-.4-1" />
            <path d="m16.8 12.3-.4-1" />
            <path d="m14.3 16.6 1-.4" />
            <path d="m20.7 13.8 1-.4" />
          </svg>
          Profile
        </a>
        <a
          [class]="
            currentTab === 'friends'
              ? 'snap-start relative inline-flex flex-nowrap items-center gap-x-2 px-2.5 py-1.5 bg-emerald-100 text-emerald-700 text-sm whitespace-nowrap rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden after:absolute after:-bottom-0.5 after:inset-x-0 after:z-10 after:w-1/4 after:h-0.5 after:bg-emerald-600 after:rounded-full after:mx-auto after:pointer-events-none cursor-pointer'
              : 'snap-start relative inline-flex flex-nowrap items-center gap-x-2 px-2.5 py-1.5 hover:bg-gray-100 text-gray-500 hover:text-gray-800 text-sm whitespace-nowrap rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-gray-100 after:absolute after:-bottom-0.5 after:inset-x-0 after:z-10 after:w-1/4 after:h-0.5 after:rounded-full after:mx-auto after:pointer-events-none cursor-pointer'
          "
          (click)="currentTabChange.emit('friends')"
        >
          <svg
            class="shrink-0 size-4"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          Friends
        </a>
      </nav>
    </div>
    <!-- End Nav -->
  </div>
  <!-- End Header -->

  <!-- Message Modal -->
  <app-message-modal
    [isOpen]="isMessageModalOpen"
    [friendId]="profileUserId || null"
    [friendName]="getFullName()"
    [friendUsername]="getUsername()"
    (closeModal)="closeMessageModal()"
  ></app-message-modal>
</div>
