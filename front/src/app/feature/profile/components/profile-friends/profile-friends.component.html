<div
  class="p-3 md:p-5 bg-white border border-gray-200 shadow-2xs rounded-xl mb-5"
>
  <div class="mb-6">
    <h2 class="text-xl font-semibold text-gray-800 mb-2">Friends</h2>
    <p class="text-gray-600">Your connections and friendships</p>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading$ | async" class="text-center py-8">
    <div
      class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-gray-900"
    ></div>
    <p class="mt-2 text-sm text-gray-600">Loading friends...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error$ | async as error" class="text-center py-8">
    <p class="text-sm text-red-600">{{ error }}</p>
  </div>

  <!-- Friends Grid -->
  <div *ngIf="!(loading$ | async) && !(error$ | async)">
    <ng-container *ngIf="friends$ | async as friends">
      <div
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"
      >
        <div
          *ngFor="let friendship of friends"
          class="flex flex-col p-4 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors"
        >
          <!-- Friend Info -->
          <div class="flex items-center space-x-3 mb-4">
            <img
              class="w-12 h-12 rounded-full object-cover"
              [src]="
                getFriendAvatar(friendship) ||
                'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80'
              "
              [alt]="getFriendName(friendship)"
            />
            <div class="flex-1 min-w-0">
              <h3 class="font-medium text-gray-900 truncate">
                {{ getFriendName(friendship) }}
              </h3>
              <p class="text-sm text-gray-500 truncate">
                &#64;{{ getFriendUsername(friendship) }}
              </p>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="flex space-x-2 mt-auto">
            <button
              class="flex-1 px-3 py-2 text-sm bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition-colors cursor-pointer"
            >
              Message
            </button>
            <button
              class="flex-1 px-3 py-2 text-sm bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors cursor-pointer"
              (click)="removeFriend(friendship)"
            >
              Remove
            </button>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- Empty State -->
    <div
      *ngIf="
        !(loading$ | async) &&
        !(error$ | async) &&
        (friends$ | async)?.length === 0
      "
      class="text-center py-12"
    >
      <div
        class="mx-auto w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mb-4"
      >
        <svg
          class="w-12 h-12 text-gray-400"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
          ></path>
        </svg>
      </div>
      <h3 class="text-lg font-medium text-gray-900 mb-2">No friends yet</h3>
      <p class="text-sm text-gray-500">
        Start connecting with people to build your network!
      </p>
    </div>
  </div>
</div>
