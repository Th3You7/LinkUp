<div class="p-2 sm:p-5 sm:py-0 md:pt-5 space-y-8">
  <app-profile-header
    (currentTabChange)="setCurrentTab($event)"
  ></app-profile-header>
  <div class="mt-6">
    <app-profile-main
      *ngIf="getCurrentTab() === 'my-profile'"
    ></app-profile-main>
    <app-profile-friends
      *ngIf="getCurrentTab() === 'friends'"
    ></app-profile-friends>
  </div>
</div>
