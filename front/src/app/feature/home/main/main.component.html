<!-- Main Content Area -->
<div class="mx-auto space-y-6">
  <!-- Create Post Section -->
  <app-create-post></app-create-post>

  <!-- Stories Section -->
  <div class="flex gap-4 overflow-x-auto pb-2">
    <div *ngFor="let user of avatarUsers; let i = index" class="flex-shrink-0">
      <div class="relative">
        <div
          class="rounded-lg overflow-hidden border-2 border-gray-300 p-0.5"
          [class]="getStoryBackgroundColor(i)"
          style="width: 112.5px; height: 200px"
        >
          <!-- Add Story for first item -->
          <div
            *ngIf="i === 0"
            class="w-full h-full flex items-center justify-center"
          >
            <div class="text-center">
              <svg
                class="w-8 h-8 text-white mx-auto mb-2"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
              </svg>
              <span class="text-white font-semibold text-sm">Add Story</span>
            </div>
          </div>

          <!-- Avatar for other stories -->
          <div *ngIf="i !== 0" class="w-full h-full relative">
            <div
              class="w-8 h-8 rounded-full bg-white flex items-center justify-center absolute top-2 left-2"
            >
              <span class="text-gray-700 font-semibold text-sm">{{
                user.name.charAt(0)
              }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Posts Feed -->
  <div class="space-y-6">
    <!-- Loading State -->
    <div
      *ngIf="loading$ | async"
      class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 text-center"
    >
      <div
        class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto mb-4"
      ></div>
      <p class="text-gray-500">Loading posts...</p>
    </div>

    <!-- Error State -->
    <div
      *ngIf="error$ | async"
      class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 text-center"
    >
      <div class="text-red-500 mb-2">
        <svg
          class="w-8 h-8 mx-auto mb-2"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        <p class="text-red-500">Error: {{ error$ | async }}</p>
      </div>
    </div>

    <!-- Posts List -->
    <app-post-card
      *ngFor="let post of (posts$ | async) || []; let i = index"
      [post]="post"
      [loading]="loading$ | async"
      [error]="error$ | async"
      [index]="i"
      (openPostPreview)="onOpenPostPreview($event)"
      class="w-full"
    ></app-post-card>

    <!-- No Posts State -->
    <div
      *ngIf="
        !(loading$ | async) &&
        !(error$ | async) &&
        ((posts$ | async) || []).length === 0
      "
      class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 text-center"
    >
      <div class="text-gray-400 mb-4">
        <svg
          class="w-12 h-12 mx-auto"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
          />
        </svg>
      </div>
      <h3 class="text-lg font-medium text-gray-900 mb-2">No posts yet</h3>
      <p class="text-gray-500">
        Be the first to share something with your friends!
      </p>
    </div>
  </div>

  <!-- Post Preview Modal -->
  <app-post-preview
    *ngIf="selectedPost"
    [post]="selectedPost"
    [isOpen]="isPostPreviewOpen"
    (closeModal)="onClosePostPreview()"
  ></app-post-preview>
</div>
