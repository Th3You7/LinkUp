<!-- Friends Request Sidebar -->
<div class="w-full h-full">
  <div class="h-full flex flex-col">
    <!-- Header -->
    <div class="pt-6 pb-2 px-5 flex justify-between items-center gap-x-2">
      <span class="block truncate font-semibold text-gray-800 text-lg">
        Friend Requests
      </span>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="flex-1 flex justify-center">
      <div class="flex flex-col items-center gap-3">
        <div
          class="w-8 h-8 border-2 border-emerald-600 border-t-transparent rounded-full animate-spin"
        ></div>
        <p class="text-sm text-gray-500">Loading requests...</p>
      </div>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !loading" class="flex-1 flex justify-center">
      <div class="text-center p-4">
        <div
          class="w-12 h-12 mx-auto mb-3 bg-red-100 rounded-full flex items-center justify-center"
        >
          <svg
            class="w-6 h-6 text-red-600"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            ></path>
          </svg>
        </div>
        <p class="text-sm text-gray-600 mb-2">{{ error }}</p>
        <button
          (click)="loadFriendRequests()"
          class="text-sm text-emerald-600 hover:text-emerald-700 font-medium"
        >
          Try again
        </button>
      </div>
    </div>

    <!-- Empty State -->

    <!-- Friend Requests List with Custom Scrollbar -->
    <div
      *ngIf="!loading && !error && friendRequests.length > 0"
      class="h-full overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-gray-100 [&::-webkit-scrollbar-thumb]:bg-gray-300"
    >
      <div class="p-4 space-y-3">
        <app-request-item
          *ngFor="let request of friendRequests; trackBy: trackByRequestId"
          [request]="request"
          (requestHandled)="onRequestHandled($event)"
        ></app-request-item>
      </div>
    </div>
  </div>
</div>
