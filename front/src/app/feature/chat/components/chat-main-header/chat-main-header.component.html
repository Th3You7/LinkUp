<header
  class="sticky top-0 inset-x-0 z-9 p-2 sm:px-5 flex justify-between gap-x-2 xl:grid xl:grid-cols-2 bg-white border-b border-gray-200"
>
  <div class="lg:hidden w-20 sm:w-auto flex items-center">
    <div class="sm:-ms-3">
      <button
        type="button"
        class="flex justify-center items-center gap-x-1 py-1.5 px-2 min-h-8 text-xs text-gray-600 bg-white hover:bg-gray-100 rounded-full disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-gray-100"
        aria-label="Toggle navigation"
      >
        <svg
          class="shrink-0 size-4 -ms-1"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m15 18-6-6 6-6" />
        </svg>
        Chat
      </button>
    </div>
  </div>

  <div>
    <button
      type="button"
      class="truncate flex items-center gap-x-3.5 focus:outline-hidden"
      aria-label="Toggle navigation"
    >
      <span class="lg:block hidden relative shrink-0">
        <img
          class="shrink-0 size-8 rounded-full"
          src="https://images.unsplash.com/photo-1601935111741-ae98b2b230b0?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=facearea&facepad=2.5&w=320&h=320&q=80"
          alt="Avatar"
        />
        <span
          class="absolute -bottom-0 -end-0 block size-2 rounded-full ring-2 ring-white bg-green-500"
        ></span>
      </span>
      <span class="grow text-center lg:text-start truncate">
        <span
          class="truncate block font-semibold text-sm leading-4 text-gray-800"
        >
          Costa Quinn
        </span>
        <span class="truncate block text-xs text-blue-600 leading-4">
          Online
        </span>
      </span>
    </button>
  </div>
</header>
